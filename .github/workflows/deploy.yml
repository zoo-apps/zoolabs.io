name: Deploy

# zoolabs.io is served by Cloudflare Pages, not GitHub Pages. Publishing to
# Pages was publishing into the void — the deploys went green and the live site
# never changed, because nothing points at it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # pnpm, not npm: the gui runtime is ~60 packages pinned by the overrides
      # block in pnpm-workspace.yaml, and only pnpm reads it. Installed by any
      # other client the versions drift and the build fails on a type it cannot
      # reconcile.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CF_PAGES_PROJECT || 'zoolabs-io' }}
            --branch=main
